services:
  agent:
    # This repository is the base image, so this builds it rather than pulling
    # one: about a minute from cold on a laptop, nearly all of it the upstream
    # pull. That upstream is public and pulls anonymously, so a `403 Forbidden`
    # on it is a stale `docker login` rather than an entitlement -- `docker
    # logout` and build again.
    build: .
    # Where Plow is and the agent's own token: the KEY=VALUE file
    # `plow-agents mint <line>` writes, loaded as environment. exe.dev sets
    # PLOW_API_BASE alone and injects the token at its proxy; here nothing
    # sits in between, so the token comes along. `PLOW_CREDENTIALS` points
    # env_file at a credential outside the checkout (a durable smoke keeps it
    # there so `down -v` and re-export can't wipe it); unset, it is the
    # in-checkout file. Local-compose only — exe.dev injects the environment
    # itself and never reads this file, so the default is unchanged there.
    env_file: ${PLOW_CREDENTIALS:-./plow-credentials}
    volumes:
      # The agent's home, kept across `up`/`down` for its sessions and setup.
      # `docker compose down -v` starts this agent fresh. An edit to SOUL.md
      # does not need it -- plow-init composes the identity into the home on
      # every boot.
      - agent-home:/var/lib/hermes
    # The agent checkpoints its session on SIGTERM and its supervisor allows
    # 30s for that, so Docker's own deadline has to sit outside that one.
    stop_grace_period: 35s

volumes:
  agent-home:
