# Overrides only. Hermes deep-merges this over its own defaults, so everything
# it already gets right is left out — a copy of the generated config would be
# 180 lines of upstream defaults that silently pin themselves the day upstream
# changes one.
#
# Credential-free and tenant-free by construction: one public image serves
# every tenant. The image owns each invariant config shape; first boot writes
# the referenced values to Hermes' dotenv without copying a credential into
# this file.
# Named `plow`, and the name is enforced rather than cosmetic: provisioning
# greps the installed config for this exact key and refuses the image without
# it. Plow's own paste-ready snippet emits the same name (and `plow-<device>`
# for the per-device form), so a provisioned agent and a hand-registered one
# read alike,
# and it is the prefix the relay's tools carry in the model's tool list.
mcp_servers:
  plow:
    url: "${PLOW_MCP_URL}"
    headers:
      Authorization: "Bearer ${PLOW_AGENT_TOKEN}"
    enabled: false
# `clarify` is the tool behind the ❓ rows: it renders a blocking menu and stops
# the turn until the owner answers it. Over iMessage there is nobody who can --
# the menu has no rendering in the transport the owner is actually holding, so
# the turn simply stops. And it has never been reached deliberately: it is what
# a turn grabs when it cannot find the mechanism it wants, and it fired three
# times during onboarding as "❓ placeholder".
#
# So the tool is taken away rather than forbidden in prose, which held right up
# until a turn was confused -- exactly when it does not. `clarify` is the only
# tool in its toolset (tools/clarify_tool.py), so disabling the toolset removes
# that one and nothing else; the key is read by gateway/run.py.
agent:
  disabled_toolsets:
    - clarify
    # `browser` is Hermes' own browser_* / browser_exec stack. Nothing on
    # this box can back it: the Browser Use harness needs a desktop Chrome and
    # the agent-browser CLI is not installed, so every call ends in
    # chrome-not-running. Advertised anyway, a fresh agent picks it over the
    # relay's own browser tools, fails, and tells the owner the browser is
    # down. Browsing goes through the relay, on the owner's own machine.
    - browser
  # Incident 2026-09-03 07:50–08:20 PDT: the model provider answered 404/503 on
  # every attempt for ~30 min. The image default of 3 attempts gives up in ~14s,
  # so an owner's message mid-outage came back as "provider failed after
  # retries". The image's backoff curve is fixed (2s doubling, 60s cap, jitter),
  # so 9 attempts ride out ≈ 4–6 min of outage. Key name verified against
  # hermes-agent agent_init.py: `_agent_section.get("api_max_retries", 3)`.
  api_max_retries: 9

# Hermes' cron drift guard (#44585) skips an unpinned job whenever the global
# provider or model differs from the one snapshotted when the job was created,
# and alerts once -- into the job's own delivery target, which for a job
# registered from the CLI is nobody. Here only plow-init changes the provider,
# on boot, from this seed and HERMES_PROVIDER/HERMES_MODEL: a change is a
# deploy, not drift, and spend is capped by Plow. Left on, the fleet's move
# onto this image (2026-09-06) silently stopped every cron job created under
# the previous provider. Key name verified against hermes_cli/config.py:
# `cron_config.get("model_drift_guard", True) is not False`.
cron:
  model_drift_guard: false

# The relay's tools are listed directly, not behind Hermes' tool_search bridge.
# By default Hermes hides every MCP tool behind tool_search / tool_describe /
# tool_call, and the model then has to nest a tool's real arguments inside
# tool_call's `arguments` object. Measured live (2026-09-02, cloud agent on
# claude-sonnet-5): every multi-parameter plow_run_command call put `argv`
# inside `arguments` and left cwd / read_paths / goal beside it, the bridge
# silently dropped them, and Latch ran sqlite3 in its scratch dir -- reported to
# the owner as "iMessage needs Full Disk Access". Twelve relay tools are cheap
# to list; a bridge that loses arguments is not.
tools:
  tool_search:
    enabled: "off"

# Measured on this fleet's own traffic 2026-09-17, warm turns through a live
# gateway: GLM-5.2 bills $0.117 per million prompt tokens against Sonnet 5's
# $0.222, and Plow's proxy caches it as readily (a 38k-token agent prompt came
# back 38,208 cached on the second turn). It is the cheapest model that is still
# an agent: Artificial Analysis scores it 34 to Sonnet's 38, and the models
# cheaper than it fall off a cliff on tool use -- Kimi K2.5 is 23 there, and
# half GLM's Terminal-Bench, for a further third off the bill. What the agent
# does all day is drive twelve relay tools over a long conversation, so that is
# the axis the choice is made on, not price alone.
model:
  default: z-ai/glm-5.2
  provider: plow
  base_url: "${PLOW_API_BASE}/v1"
  key_env: HERMES_CUSTOM_PLOW_API_KEY
providers:
  plow:
    name: plow
    base_url: "${PLOW_API_BASE}/v1"
    key_env: HERMES_CUSTOM_PLOW_API_KEY
    stale_timeout_seconds: 55
    models:
      z-ai/glm-5.2: {}
      anthropic/claude-sonnet-5: {}

# GLM-5.2 cannot see. OpenRouter answers an image part on that route with
# `404 No endpoints found that support image input`, and an owner sending a
# receipt over iMessage is the ordinary case here, not an edge one -- so the
# cheap text model needs a lane that can look at pictures.
#
# Hermes already owns this seam: `decide_image_input_mode` attaches images
# inline for a model that sees, and otherwise runs `vision_analyze` first and
# prepends the description. That second path needs a backend named, and on a
# `custom` provider it has no default to fall back to. Naming one is what keeps
# a photo turn from arriving as a 404 instead of an answer.
#
# Sonnet 5 rather than the cheaper multimodal Kimi: a photo here is usually a
# receipt or a screenshot the owner expects read back accurately, images are a
# small share of turns, and a misread costs more than the tokens save. It is
# the one place in this config where the expensive model is still the right
# one. Note this also routes images through description when the main model
# CAN see (Hermes forces `text` whenever a vision backend is explicit) --
# accepted: it is one rule for every model this image might be pointed at.
auxiliary:
  vision:
    provider: plow
    model: anthropic/claude-sonnet-5

# Hermes compresses at 50% of whatever window it resolves, and it resolves
# GLM-5.2's as 1,048,576 -- so left alone an agent grows to half a million
# tokens before it summarizes anything, and every turn re-reads that whole
# prefix. Cost is linear in prompt size, so it argues only for "lower"; the
# number itself has to come from where the model stops being reliable.
#
# 128k is the top of what GLM-5.2's own report evidences. It measures a
# retrieval gap there -- RULER@128K -5.69, RepoQA@128K -7.33 against its
# short-context self, the price of the sparse attention that buys the 1M
# window -- and its flat-retrieval demonstration covers 25k to 50k only.
# Past 128k there is no published measurement to stand on, which is the real
# argument against the half-million the default would pick: not that it is
# expensive, but that nobody has shown the model still works there.
#
# It is a ceiling, not a target: `threshold_tokens` applies as the LOWER of it
# and the ratio, most turns never reach it, and Hermes protects the head and
# the last 20 messages either way, so what a summary replaces is the middle of
# a long conversation rather than anything recent.
compression:
  threshold_tokens: 128000
# Hermes announces every memory write, and that is noise to an owner who asked
# one question over iMessage -- but the plow_chat plugin already drops that
# announcement, and every other prefixed diagnostic, unless the owner's
# `verbose_output_enabled` preference is set (its `send`, on the
# BACKGROUND_REVIEW / NO_REPLY / WORKING prefixes). Setting this to "off" here
# suppressed it a second time, at the producer, where no preference can reach
# it: `summarize_background_review_actions` returns [] for mode "off", so the
# message the plugin's gate exists to gate was never created. Two owners of one
# behaviour, and the static one upstream always won -- the dashboard toggle
# could not turn it back on. Produce it; let the preference decide delivery.
#
# NOT set here: display.interim_assistant_messages. Hermes also delivers any
# prose the model emits before or between tool calls as its own chat message,
# and turning that off looked like the structural fix for commentary reaching
# the owner. It is the opposite: with interim delivery off, the introduction
# disappears and the owner's turn becomes a bare acknowledgement of work they
# never saw.
#
# The model writes the real message mid-turn, before its last tool call, and a
# note to itself afterwards. Interim delivery is what carries the real message;
# switching it off deletes that and keeps only the note. A leaked note is
# cosmetic; a missing introduction is the product. So the commentary stays a
# prompt problem, and this key stays absent until something can suppress the
# notes without suppressing the message they were written beside.
display:
  memory_notifications: "on"
  # When a write_file or patch fails and nothing later writes that path,
  # Hermes appends a "⚠️ File-mutation verifier" footer to the reply —
  # container paths and a traceback, addressed to a developer reading a
  # terminal. Delivered to an owner over iMessage it is unreadable noise in
  # the middle of an answer; seen live during onboarding. The model still
  # gets the tool's failure in its own turn, so the guard against a silent
  # over-claim survives; only the footer to the owner stops.
  file_mutation_verifier: false
  # Hermes texts a busy acknowledgement ("↪ Redirected current run…",
  # "⏳ Queued for the next turn…") whenever a message lands mid-run — one per
  # human line in a group chat during a two-minute task. The message is still
  # processed; only the echo stops. Key verified against gateway/run.py, which
  # maps it to HERMES_GATEWAY_BUSY_ACK_ENABLED.
  busy_ack_enabled: false
  # A message that lands mid-run waits for the run to finish and gets its own
  # turn, instead of being injected into the running task as a "correction" —
  # in a group chat that was every bystander's aside. /stop stays the mid-run
  # escape. The gateway picks this mode per profile, never per sender, so the
  # plugin makes the one exception itself: the owner's own DM text interrupts
  # the run (hermes-plugin-plow#198). This stays `queue` for everyone else.
  busy_input_mode: queue
  # Hermes quiets its own iMessage adapters (photon, bluebubbles are
  # display_config._TIER_LOW) but a plugin platform gets the global defaults:
  # tool-progress bubbles and a "⏳ Working — N min" heartbeat every 3 minutes.
  # iMessage cannot edit or delete a message, so each one is permanent in the
  # thread.
  #
  # tool_progress stays off: the bubbles are the noisiest of the surfaces and
  # Hermes edits and later deletes them by message id, which the plugin's
  # delivery gate cannot honour for a message it dropped.
  #
  # long_running_notifications does NOT stay off, for the same reason
  # memory_notifications no longer does. The plugin gates the heartbeat on
  # `verbose_output_enabled` -- that is what hermes-plugin-plow#60 added, one day
  # before this key turned the heartbeat off at the producer and made that gate
  # dead code. `_NOTIFY_INTERVAL` is None when this is false, so nothing is ever
  # emitted for the gate to read. Produce it; let the preference decide.
  platforms:
    plow_chat:
      tool_progress: "off"
      long_running_notifications: true
# Hermes' 2200-char default is a budget for durable technique notes, and an
# agent that also records outcomes ("the $1,500 transfer completed") loses them
# to consolidation within a day or two — the one-line facts are what get dropped
# when the store is over budget, and a later session then acts as if the thing
# never happened. 6000 leaves room for both.
memory:
  memory_char_limit: 6000
platforms:
  plow_chat:
    enabled: true
# The agent runs as the host user on its own VM; there is no container runtime
# on the box to hand a terminal to.
terminal:
  backend: local
  # Where Hermes looks for HERMES.md (plow-init writes it from Latch's
  # instructions, #72); unset, it falls back to /opt/hermes and skips that.
  cwd: /var/lib/hermes
group_sessions_per_user: false
# A long-lived chat keeps the system prompt it was built with, and the only
# date in that prompt is the day it was built -- so the day after, the model
# still believes it is that day, and offers an owner's contact a slot that has
# already passed (seen live 2026-09-16). Stamping each message with the time it
# arrived puts today in front of the model on every turn. The stamp is rebuilt
# from each stored message's own time, so the history bytes stay the same turn
# to turn and the prompt cache holds. Key verified against hermes-agent
# gateway/run.py `_message_timestamps_enabled`.
gateway:
  message_timestamps:
    enabled: true
onboarding:
  profile_build: "off"
plugins:
  enabled:
    - plow-chat-platform
  entries:
    plow-chat-platform:
      # The plugin registers the platform plus its Plow-specific tools, and
      # none of them replaces an image tool. Denying overrides keeps a future
      # name collision from silently shadowing one, which would be invisible
      # from this file.
      allow_tool_override: false
_config_version: 37
