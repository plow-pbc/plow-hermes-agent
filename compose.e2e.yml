# End to end against a Plow stack running on this machine, with the image built
# from this checkout rather than pulled.
#
#   docker compose -f compose.yml -f compose.e2e.yml up -d
#
# Set PLOW_API_BASE=http://api:8000 in .env: the stack's API is reached by
# container name on the network below, so no host port has to be guessed and
# the value does not change when the stack's ports do.
services:
  agent:
    build: .
    image: plow-hermes-agent:local
    networks: [default, plow]

networks:
  # The dev stack's own compose network, joined rather than created.
  plow:
    name: plow_default
    external: true
